<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1E3A5F">
  <title>نظام إدارة الأوردرات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <section id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="brand brand-centered">
        <div class="brand-mark">📦</div>
        <div><strong>نظام إدارة الأوردرات</strong><span>إدارة أبسط. نتائج أوضح.</span></div>
      </div>
      <h1>مرحبًا بعودتك</h1>
      <p class="muted">سجّل الدخول للوصول إلى لوحة التحكم</p>
      <form id="login-form" novalidate>
        <label for="username">البريد الإلكتروني</label>
        <input id="username" name="username" type="email" autocomplete="username" required placeholder="مثال: eslam@example.com">
        <label for="password">كلمة المرور</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="أدخل كلمة المرور">
        <label class="checkbox-row"><input id="remember-me" type="checkbox"><span>تذكرني على هذا الجهاز</span></label>
        <div id="login-error" class="form-error" role="alert"></div>
        <button class="btn btn-primary btn-block" type="submit">دخول <span>←</span></button>
      </form>
    </div>
  </section>

  <section id="app-screen" class="app-screen hidden">
    <header class="topbar">
      <button id="sidebar-toggle" class="icon-btn mobile-only" aria-label="فتح القائمة">☰</button>
      <div class="topbar-brand"><span class="brand-mark small">📦</span><strong>إدارة الأوردرات</strong></div>
      <div class="topbar-actions">
        <button id="theme-toggle" class="icon-btn" title="تبديل المظهر" aria-label="تبديل المظهر">◐</button>
        <div class="user-chip"><span id="nav-avatar" class="avatar">م</span><span><b id="nav-user-name">المستخدم</b><small id="nav-user-role">الدور</small></span></div>
        <button id="logout-btn" class="btn btn-outline btn-small">خروج</button>
      </div>
    </header>
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
    <aside id="sidebar" class="sidebar">
      <nav id="main-nav" aria-label="القائمة الرئيسية"></nav>
      <div class="sidebar-footer"><span class="status-dot"></span> متصل بقاعدة البيانات</div>
    </aside>
    <main id="main-content" class="main-content"></main>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="loading" class="loading-overlay hidden"><div class="spinner"></div><span>جارٍ الحفظ...</span></div>
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-card"><div class="modal-header"><h2 id="modal-title"></h2><button id="modal-close" class="icon-btn" aria-label="إغلاق">×</button></div><div id="modal-content" class="modal-content"></div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/marketer.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/manage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
